name: Docs build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run build
      - name: Verify published files
        run: |
          test -s dist/index.html
          test -s dist/assets/style.css
          test -s dist/assets/app.js
          test -s dist/openapi/v1.yaml
